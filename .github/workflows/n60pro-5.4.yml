name: n60pro-5.4

on:
  repository_dispatch:
  workflow_dispatch:
  
 # schedule:
 #  - cron: 0 11 * * 2
  

env:
  REPO_URL: https://github.com/CoverUp137/immortalwrt-mt798x-6.6.git
  REPO_BRANCH: 2410
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 237/n60pro5.4.config
  DIY_P1_SH: 237/diy3.sh
  DIY_P2_SH: 237/diy1.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: "Optimize Disk Space"
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"


    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Clone source code
      working-directory: ./
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a
      
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        
    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(($(nproc) * 3 / 2))
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "CPU $(nproc) thread"
        echo -e "$(($(nproc) * 3 / 2)) thread compile"
        make -j$(($(nproc) * 3 / 2)) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf *initramfs*.bin
        rm -rf *.manifest
        rm -rf *bl2.bin
        rm -rf version.buildinfo
        rm -rf sha256sums
        rm -rf profiles.json
        rm -rf feeds.buildinfo
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "PACKAGES_DIR=$PWD/packages" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Package plugins directory
      id: package_plugins
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        # 检查 packages 目录是否存在
        if [ -d "${{ env.PACKAGES_DIR }}" ]; then
          cd ${{ env.PACKAGES_DIR }}
          # 创建包含所有插件的压缩包
          tar -czf ${{ github.workspace }}/packages.tar.gz .
          echo "PACKAGES_TAR=${{ github.workspace }}/packages.tar.gz" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "Packages directory not found!"
          echo "status=failed" >> $GITHUB_OUTPUT
        fi

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=netcore-n60pro-5.4" >> $GITHUB_OUTPUT
        echo "
              
            
            1:  使用237大佬源码编译的高功率wifi固件，内核5.4
            
         
         📝 设备: 磊科Netcore N60 Pro
         
         🧠 内存: 512MB/2GB
         
         💾 闪存: 128MB
         
         💻 架构: MediaTek MT7986A (Filogic 830)

         📂 源码: $REPO_URL

         🌳 分支: $REPO_BRANCH

         ⏱️ 编译时间: $(date +"%Y年%m月%d日 %H时%M分")

         🌐 管理地址: 192.168.2.1

         👤 用户名: root

         🔒 密码: password (或空密码)" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

        
    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*
          ${{ env.PACKAGES_TAR }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 5
        keep_minimum_runs: 5

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
